name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # google-genai is required: gemini_client degrades to no-ops without
          # it, so tests asserting real config objects pass locally and fail here.
          pip install pytest requests google-genai

      # pytest discovers both plain test functions and unittest.TestCase
      # classes, so the two styles already in tests/ run under one command.
      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Validate repository
        run: python3 scripts/validate_repo.py
