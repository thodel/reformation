name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Skip the page images: 2.1 GB across eight directories that no text
      # workflow reads. Measured here, a plain checkout takes 92 seconds and
      # leaves a 2.0 GB .git; excluding the images takes 9 seconds and 36 MB.
      # blob:none ALONE changes nothing, because checkout refetches every blob
      # to populate the working tree - the filter only helps paired with a
      # sparse pattern.
      #
      # Deploy Pages deliberately does not do this: it publishes the site, and
      # all 496 druck_1528 manifest entries point at images/page_N.jpg.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/disputation/*/images/
            !/data/disputation/*/images_temp/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # google-genai is required: gemini_client degrades to no-ops without
          # it, so tests asserting real config objects pass locally and fail here.
          pip install pytest requests google-genai lxml

      # pytest discovers both plain test functions and unittest.TestCase
      # classes, so the two styles already in tests/ run under one command.
      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Validate repository
        run: python3 scripts/validate_repo.py
