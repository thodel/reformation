name: Describe segments

# Fills the title and summary columns of the segment table (issue: semi-manual
# segmentation). Manual only: the table is meant to be corrected by hand, and a
# scheduled run would keep proposing over the top of that work.
#
# Rows that already carry a title are skipped unless overwrite is set, so hand
# edits survive a re-run.
on:
  workflow_dispatch:
    inputs:
      witness:
        description: "Witness key"
        type: string
        default: "druck_1528"
      limit:
        description: "Only the first N undescribed segments (0 = all)"
        type: string
        default: "0"
      overwrite:
        description: "Also redo rows that already have a title (discards hand edits)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: describe-segments
  cancel-in-progress: false

jobs:
  describe:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      # Skip the page images: 2.1 GB across eight directories that no text
      # workflow reads. Measured here, a plain checkout takes 92 seconds and
      # leaves a 2.0 GB .git; excluding the images takes 9 seconds and 36 MB.
      # blob:none ALONE changes nothing, because checkout refetches every blob
      # to populate the working tree - the filter only helps paired with a
      # sparse pattern.
      #
      # Deploy Pages deliberately does not do this: it publishes the site, and
      # all 496 druck_1528 manifest entries point at images/page_N.jpg.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/disputation/*/images/
            !/data/disputation/*/images_temp/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Describe
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=""
          if [[ "${{ inputs.overwrite }}" == "true" ]]; then EXTRA="--overwrite"; fi
          python3 scripts/describe_segments.py \
            --witness "${{ inputs.witness }}" \
            --limit "${{ inputs.limit }}" \
            $EXTRA | tee /tmp/describe.txt

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Abschnitte beschrieben"
            echo '```'
            tail -n 60 /tmp/describe.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/segments/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: describe print segments"
          git pull --rebase --autostash
          git push
