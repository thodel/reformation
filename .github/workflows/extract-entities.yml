name: Extract entities

# Named-entity extraction over the recognised texts. Manual only: it costs API
# calls, and the register built on top of it is meant to be corrected by hand,
# so a scheduled run would keep proposing over that work.
#
# Incremental - a page already extracted under the same prompt and model is not
# sent again, so re-running after adding a witness costs only that witness.
on:
  workflow_dispatch:
    inputs:
      witness:
        description: "Witness key, or empty for every witness that needs it"
        type: string
        default: ""
      max_pages:
        description: "Stop after this many pages per witness (0 = all)"
        type: string
        default: "0"
      model:
        description: "Model id"
        type: string
        default: "gemini-3.7-flash"

permissions:
  contents: write

concurrency:
  group: extract-entities
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      # Skip the page images: 2.1 GB across eight directories that no text
      # workflow reads. Measured here, a plain checkout takes 92 seconds and
      # leaves a 2.0 GB .git; excluding the images takes 9 seconds and 36 MB.
      # blob:none ALONE changes nothing, because checkout refetches every blob
      # to populate the working tree - the filter only helps paired with a
      # sparse pattern.
      #
      # Deploy Pages deliberately does not do this: it publishes the site, and
      # all 496 druck_1528 manifest entries point at images/page_N.jpg.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/disputation/*/images/
            !/data/disputation/*/images_temp/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Check the key is present
        run: |
          if [[ -z "${GEMINI_API_KEY:-}" ]]; then
            echo "::error::GEMINI_API_KEY secret is not set."
            exit 1
          fi

      - name: Extract
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=""
          if [[ -n "${{ inputs.witness }}" ]]; then EXTRA="--witness ${{ inputs.witness }}"; fi
          python3 scripts/extract_entities.py \
            --model "${{ inputs.model }}" \
            --max-pages "${{ inputs.max_pages }}" \
            $EXTRA > /tmp/ner.txt 2>&1 || { tail -40 /tmp/ner.txt; exit 1; }
          tail -30 /tmp/ner.txt


      - name: Summary
        shell: bash
        run: |
          {
            echo "### Entitäten"
            echo '```'
            tail -n 25 /tmp/ner.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Two commits, deliberately. The per-witness state is the only thing this
      # run actually produced; the merged file and the registers are derived
      # from every witness's state at once. Committing the derived files before
      # rebasing made two runs conflict on the same regenerated lines, and the
      # loser threw away its extraction - 1701 lost fourteen minutes of work
      # that way. Rebasing on state alone, then rebuilding on top, cannot
      # conflict: the inputs merge cleanly because they are per witness.
      - name: Commit the extraction state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/entities/*_state.json
          if git diff --staged --quiet; then
            echo "No new extraction state."
          else
            git commit -m "chore: extraction state"
          fi
          git pull --rebase --autostash
          git push

      - name: Rebuild the merged file and the registers
        run: |
          python3 scripts/extract_entities.py --merge-only
          python3 scripts/build_person_register.py
          python3 scripts/recognize_bible_refs.py

      - name: Commit the derived files
        shell: bash
        run: |
          set -euo pipefail
          git add data/entities/named_entities.json data/register/
          if git diff --staged --quiet; then
            echo "Nothing derived changed."
            exit 0
          fi
          git commit -m "chore: rebuild entity register"
          # Derived files are rebuilt from state, so a conflict here is resolved
          # by regenerating rather than by merging text.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash; then break; fi
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/extract_entities.py --merge-only
            python3 scripts/build_person_register.py
            python3 scripts/recognize_bible_refs.py
            git add data/entities/named_entities.json data/register/
            git diff --staged --quiet || git commit -m "chore: rebuild entity register"
          done
          git push
